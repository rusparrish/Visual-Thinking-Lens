<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Parallax</title>
    <link rel="stylesheet" href="css/style.css">
</head>
<body>

<div id="processing">computing&hellip;</div>

<header>
    <div class="wordmark"><span class="glyph">◈</span>Parallax</div>
    <div class="tagline">The mask is the question you're asking the image. Choose it carefully.</div>
    <div class="legend">
        <div class="legend-item">
            <div class="dot" style="background:#7c7cff"></div>
            VTL baseline
        </div>
        <div class="legend-item">
            <div class="dot" style="background:#5dff91"></div>
            Cone channels
        </div>
        <div class="legend-item">
            <div class="dot" style="background:#ffd45a"></div>
            Opponent channels
        </div>
        <div class="legend-item">
            <div class="dot" style="background:#ff8066"></div>
            Color deficiency
        </div>
        <div class="legend-item">
            <div class="dot" style="background:#c8a0ff"></div>
            Combined
        </div>
        <div class="legend-sep">
            <span style="color:#00e5ff">+</span>
            <span>= gradient centroid (Δx, Δy)</span>
            <span style="color:#555568">&nbsp;·&nbsp;</span>
            <span style="color:#888">•</span>
            <span>= image center</span>
        </div>
    </div>
</header>

<main>

    <label id="upload-zone" for="file-input">
        <div>Drop an image here, or click to upload.</div>
        <div class="hint">PNG · JPG · WEBP &nbsp;·&nbsp; resized to 480px for computation</div>
        <input type="file" id="file-input" accept="image/*">
    </label>

    <div id="workspace">

        <div class="ws-header">
            <div class="orig-wrap">
                <div class="section-label">original</div>
                <img id="orig-img" alt="original image">
            </div>
            <div class="scatter-wrap">
                <div class="section-label">where does each mask say the image lives?</div>
                <canvas id="scatter-canvas"></canvas>
            </div>
        </div>

        <hr class="div">

        <div id="grid" class="grid"></div>

    </div>

</main>

<script src="js/app.js"></script>
</body>
</html>
